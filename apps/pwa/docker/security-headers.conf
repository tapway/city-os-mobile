# Included in every location that sets its own add_header (nginx does not
# inherit add_header into a location that declares one).
# HSTS is deliberately NOT set here: TLS is terminated by the host's reverse
# proxy, which is the right place to decide it.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
# REPORT-ONLY: nothing is blocked; browsers log what a strict policy would block
# (see the console). Based on what the app uses: it has no external scripts, tiles,
# fonts or APIs (the Google Maps link is a navigation, not a subresource).
# Enforcing it (rename the header, after a clean soak) is a follow-up.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
