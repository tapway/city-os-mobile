# City OS Mobile PWA: static files + reverse proxy of /api and /auth to the BFF.
# Reached through the host's TLS-terminating proxy, which must send Host,
# X-Forwarded-Proto and X-Forwarded-For (see deploy/README-mobile.md).

# Pass through what the host proxy told us; fall back to what we can see.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_for $fwd_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. The BFF name is resolved per request (variable in
    # proxy_pass), so nginx starts even if `bff` is not up yet and follows a
    # recreated container to its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml
               application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Evidence photos go through /api/uploads (BFF limit is 8 MiB).
    client_max_body_size 10m;

    # The browser must always revalidate the shell and the service worker, or a
    # new release is never picked up. Hashed assets below are immutable.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Vite emits content-hashed files under /assets/. A missing one must be a
    # 404, never the SPA fallback (a cached HTML-as-JS response breaks the app).
    location /assets/ {
        # No "always": an error response must not be cached as immutable.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Icons are not hashed: cache for a day.
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- BFF ---------------------------------------------------------------
    location /api/ {
        set $bff http://bff:8002;
        proxy_pass $bff;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }

    location /auth/ {
        set $bff http://bff:8002;
        proxy_pass $bff;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }

    # SPA fallback: unknown paths get the shell (client-side routing). The
    # internal redirect to /index.html picks up its no-cache location above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
