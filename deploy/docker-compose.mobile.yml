# City OS Mobile: PWA (nginx) + BFF (FastAPI) in front of the City Help API.
#
#   docker compose -f deploy/docker-compose.mobile.yml --env-file .env.mobile up -d
#
# See deploy/README-mobile.md. Configuration comes ONLY from the env file given
# with --env-file (never committed; template: deploy/.env.mobile.example).
#
# The project name is fixed here so this stack can never collide with City Help,
# whose compose project is called "deploy". Override with `-p` if you must run
# two copies side by side.
name: city-os-mobile

services:
  bff:
    image: tapway/city-os-mobile-bff:${MOBILE_TAG:-latest}
    restart: unless-stopped
    # Reach a City Help / Keycloak / MinIO running on the docker host itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- Keycloak ---------------------------------------------------------
      KEYCLOAK_URL: ${KEYCLOAK_URL:?set KEYCLOAK_URL (server-side realm base) in the env file}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-city-os-mobile}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:5173/auth/callback}
      AUTH_MODE: ${AUTH_MODE:-password}
      # --- City Help --------------------------------------------------------
      CITY_HELP_API_URL: ${CITY_HELP_API_URL:?set CITY_HELP_API_URL in the env file}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS:-30}
      # --- Cookies / origins ------------------------------------------------
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Secure by default: this stack is meant to sit behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PWA_ORIGINS: ${PWA_ORIGINS:?set PWA_ORIGINS (public https origin(s), comma separated) in the env file}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-5}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-12}
      # --- Rate limits ------------------------------------------------------
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-30}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-300}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-120}
      # --- Evidence photos (optional; uploads are off without MinIO) --------
      UPLOADS_PREFIX: ${UPLOADS_PREFIX:-mobile-attachments}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      ALLOWED_UPLOAD_TYPES: ${ALLOWED_UPLOAD_TYPES:-image/jpeg,image/png,image/webp,image/heic,image/heif}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-city-help}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    networks:
      - default
      # Optional: join an existing network (e.g. City Help's "deploy_default")
      # so CITY_HELP_API_URL / KEYCLOAK_URL can use container names. Leave
      # UPSTREAM_NETWORK unset when they are plain URLs (LAN / host).
      - upstream
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  pwa:
    image: tapway/city-os-mobile-pwa:${MOBILE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    ports:
      # The ONLY published port, loopback only: the host's TLS proxy forwards here.
      - "127.0.0.1:${MOBILE_PORT:-19447}:8080"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  default: {}
  upstream:
    external: true
    # "bridge" (docker's built-in network) is the no-op default: attaching to it
    # changes nothing for the BFF. Set UPSTREAM_NETWORK=deploy_default to join
    # City Help's network.
    name: ${UPSTREAM_NETWORK:-bridge}
